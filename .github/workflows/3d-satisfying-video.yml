name: 3D Satisfying Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PUBLIC uploads a YouTube Short; DRY only renders and checks"
        type: choice
        options:
          - public
          - dry
        default: public
        required: true
  schedule:
    # Four daily runs at 09:00, 13:00, 17:00, 21:00 India Standard Time (UTC+5:30)
    - cron: "30 3,7,11,15 * * *"

permissions:
  contents: write

concurrency:
  group: 3d-satisfying-video
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r satisfying-pipeline/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Preflight checks for topic engine and 3D renderer
        run: |
          python -m py_compile satisfying-pipeline/topics.py satisfying-pipeline/run_pipeline.py satisfying-pipeline/render_video.py satisfying-pipeline/audio.py satisfying-pipeline/upload_youtube.py satisfying-pipeline/test_renderer.py satisfying-pipeline/test_topics.py
          python satisfying-pipeline/topics.py --total --preview 12
          python satisfying-pipeline/test_topics.py
          node --check satisfying-pipeline/renderer/scenes.js
          python satisfying-pipeline/test_renderer.py
      - name: Run pipeline (scheduled runs are always PUBLIC)
        working-directory: satisfying-pipeline
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry' || 'false' }}
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: python run_pipeline.py
      - name: Save consumed topic state and upload history to repository
        if: ${{ success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'public')) }}
        run: |
          git config user.name "satisfying-bot"
          git config user.email "satisfying-bot@users.noreply.github.com"
          git add satisfying-pipeline/state
          if git diff --cached --quiet; then
            echo "No state/history changes to save."
            exit 0
          fi
          git commit -m "state: record successful public Short $(date -u +%F-%H%M)"
          for attempt in 1 2 3 4 5 6 7; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Upload history and consumed-topic state persisted."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo "::error::Short may already be uploaded, but history/state could not be persisted after retries."
          exit 1
      - name: Upload render/log artifacts on dry run or failure
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry') || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: 3d-satisfying-video-output
          path: |
            satisfying-pipeline/out/*.mp4
            satisfying-pipeline/work/*.log
          retention-days: 3
          if-no-files-found: ignore
