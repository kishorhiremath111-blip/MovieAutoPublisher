name: 3D Satisfying Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose PUBLIC YouTube Short upload or DRY render only"
        type: choice
        options:
          - public
          - dry
        default: dry
        required: true
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: 3d-satisfying-video
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r satisfying-pipeline/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run pipeline
        working-directory: satisfying-pipeline
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry' || 'false' }}
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: python run_pipeline.py
      - name: Save consumed topic state to repository
        if: ${{ success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'public')) }}
        run: |
          git config user.name "satisfying-bot"
          git config user.email "satisfying-bot@users.noreply.github.com"
          git add satisfying-pipeline/state
          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi
          git commit -m "state: consume published topic $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Topic state pushed."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 2
          done
          echo "Could not persist topic state after upload."
          exit 1
      - name: Upload render/log artifacts on dry run or failure
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry') || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: 3d-satisfying-video-output
          path: |
            satisfying-pipeline/out/*.mp4
            satisfying-pipeline/work/*.log
          retention-days: 3
          if-no-files-found: ignore
