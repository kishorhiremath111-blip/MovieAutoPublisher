name: VYROX DAILY Auto Shorts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly after rendering (first run should be draft-only)"
        required: true
        type: boolean
        default: false
  schedule:
    # Daily at 7:30 PM IST. Scheduled runs publish publicly.
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: vyrox-daily-auto-shorts
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore story deduplication state
        uses: actions/cache/restore@v4
        with:
          path: state/ai_updates_seen.json
          key: vyrox-daily-state-${{ github.run_id }}
          restore-keys: vyrox-daily-state-

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile ai_updates_publisher.py

      - name: Render and optionally publish
        env:
          GITHUB_ACTIONS: "true"
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            python ai_updates_publisher.py --publish
          else
            python ai_updates_publisher.py
          fi

      - name: Save story deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/ai_updates_seen.json
          key: vyrox-daily-state-${{ github.run_id }}

      - name: Save generated slides, video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyrox-daily-short-${{ github.run_number }}
          path: output/ai_updates/
          if-no-files-found: warn
          retention-days: 14
