name: VYROX DAILY Auto Shorts

on:
  push:
    branches:
      - ai-updates-publisher
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to YouTube after rendering (off = draft only)"
        required: true
        type: boolean
        default: false
      category:
        description: "Topic category for this run"
        required: true
        type: choice
        options:
          - SPACE
          - SCIENCE
          - AI
          - TECH
          - ANIMALS
          - WORLD
          - HEALTH
          - HISTORY
          - FUNNY
          - ANIME
        default: HEALTH
  schedule:
    # Two Shorts per day: 1:30 PM IST and 7:30 PM IST.
    # Scheduled runs only fire from the default branch (main).
    - cron: "0 8,14 * * *"

permissions:
  contents: write

concurrency:
  group: vyrox-daily-auto-shorts
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile ai_updates_publisher.py

      - name: Render and optionally publish
        env:
          GITHUB_ACTIONS: "true"
          VYROX_PRIVACY: ${{ vars.VYROX_PRIVACY || 'private' }}
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          CATEGORY="${{ inputs.category }}"
          if [ -z "$CATEGORY" ]; then CATEGORY="HEALTH"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            python ai_updates_publisher.py --category "$CATEGORY" --publish
          else
            python ai_updates_publisher.py --category "$CATEGORY"
          fi

      - name: Remember used stories (no repeats)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ai_updates_seen.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update VYROX DAILY used stories" && git push)

      - name: Save generated video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyrox-daily-short-${{ github.run_number }}
          path: |
            output/ai_updates/vyrox_daily_short.mp4
            output/ai_updates/upload_metadata.json
            output/ai_updates/preview_hook_overlay.png
          if-no-files-found: warn
          retention-days: 14
