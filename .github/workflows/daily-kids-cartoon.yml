name: Daily Kids Cartoon

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = sirf video banao (upload nahi), 0 = YouTube par upload bhi"
        required: true
        default: "1"
      topic:
        description: "Optional custom topic"
        required: false
        default: ""

concurrency:
  group: daily-kids-cartoon
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kids_auto_pipeline
    env:
      VIDEO_LANGUAGE: "hi"
      SUBTITLES: "1"
      DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      TOPIC: ${{ github.event.inputs.topic }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kids_auto_pipeline/requirements.txt

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate kids cartoon video
        run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-cartoon-video
          path: |
            kids_auto_pipeline/final.mp4
            kids_auto_pipeline/meta.json
          if-no-files-found: warn
          retention-days: 7
