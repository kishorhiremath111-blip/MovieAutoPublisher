name: MovieAutoPublisher Daily

on:
  schedule:
    # 7:00 PM IST = 13:30 UTC. GitHub Actions can start a little late.
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movieautopublisher-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/state.json
            state/viral_tracker.json
          key: movieautopublisher-state-${{ github.run_id }}
          restore-keys: movieautopublisher-state-

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Discover popular anime and dark-comedy trend metadata
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pop_culture_trends.py

      - name: Discover Internet Archive public-domain candidates (review only)
        continue-on-error: true
        run: python internet_archive_collector.py --discover

      - name: Build trend-to-source intake queue (review only)
        continue-on-error: true
        run: python source_intake.py

      - name: Download only manually approved public-domain sources
        run: python internet_archive_collector.py --download-approved

      - name: Run daily publisher
        env:
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python shorts_runner.py

      - name: Build daily tracker report
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python daily_tracker.py

      - name: Save persistent state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/state.json
            state/viral_tracker.json
          key: movieautopublisher-state-${{ github.run_id }}

      - name: Save logs, tracker, source intake, and generated cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_number }}
          path: |
            output/*/final/**
            output/image_posts/**
            output/social/**
            output/internet_archive_candidates.json
            output/pop_culture_trends.json
            output/source_intake_queue.json
            state/state.json
            state/viral_tracker.json
            state/daily_tracker.json
            state/daily_tracker.md
          if-no-files-found: ignore
          retention-days: 30
