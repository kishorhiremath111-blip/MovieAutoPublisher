name: Daily Luxury Short

on:
  schedule:
    # Daily public Short at 6:00 PM India time (12:30 UTC).
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = build only, private = upload privately, public = publish publicly"
        required: true
        type: choice
        options: [dry, private, public]
        default: public
      force:
        description: "Allow another video even if one was already made today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-luxury
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: luxury_pipeline
    env:
      # Match the uploader credentials expected by luxury_pipeline/daily_luxury.py
      YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      IMAGE_SOURCE: stock
      UPLOAD_MODE: ${{ github.event_name == 'schedule' && 'public' || inputs.mode || 'dry' }}
      VIDEO_RES: ${{ vars.VIDEO_RES || '1080' }}
      TZ_OFFSET_MIN: "330"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed files (informational, never blocks)
        continue-on-error: true
        working-directory: .
        run: |
          if [[ -f verify_install.py ]]; then python verify_install.py; else echo "verify_install.py not in repo (optional)."; fi

      - name: Preflight (shows what is missing; never prints secrets)
        run: python daily_luxury.py --preflight

      - name: Build and upload today's Short
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi
          python daily_luxury.py --mode "$UPLOAD_MODE" --res "$VIDEO_RES" "${ARGS[@]}"

      - name: Explain the failure (stock-only; no Gemini required)
        if: failure()
        continue-on-error: true
        working-directory: .
        run: |
          echo "This Luxury workflow is stock-photo-only. Gemini image generation and GEMINI_API_KEY are not required."
          echo "Read the failed Build and upload step above for the actual error."
          echo "If Wikimedia Commons rate-limits requests, the editor now retries and skips unrelated fallback images."

      - name: Keep the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-short-${{ github.run_id }}-${{ github.run_attempt }}
          path: luxury_pipeline/output/**/short.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Save topic history
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add -A state
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Update Luxury topic history"
            git pull --rebase
            git push
          fi
