name: VYROX GEN X — Hindi AI Science Update

on:
  push:
    branches:
      - ai-updates-publisher
    paths:
      - "scripts/hindi_ai_science_update.py"
      - ".github/workflows/hindi-ai-science-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ai-science-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: pip install pillow edge-tts
      - name: Render Hindi AI science update with male voice
        run: python scripts/hindi_ai_science_update.py
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: vyrox-hindi-ai-science-update-${{ github.run_number }}
          path: output/hindi_ai_science/VYROX_Hindi_AI_Science_Update.mp4
          if-no-files-found: error
          retention-days: 14
