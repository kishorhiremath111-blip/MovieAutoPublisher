name: VYROX GEN X — Hindi Dark Comedy Short

on:
  push:
    branches:
      - ai-updates-publisher
    paths:
      - "scripts/hindi_dark_comedy_short.py"
      - ".github/workflows/hindi-dark-comedy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-hindi-dark-comedy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: pip install pillow edge-tts
      - name: Render Hindi dark-comedy Short
        run: python scripts/hindi_dark_comedy_short.py
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: vyrox-hindi-dark-comedy-${{ github.run_number }}
          path: output/hindi_dark_comedy/VYROX_Hindi_Dark_Comedy.mp4
          if-no-files-found: error
          retention-days: 14
