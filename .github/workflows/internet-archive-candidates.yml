name: Internet Archive Candidate Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install requests Pillow

      - name: Discover review-only candidates
        run: python internet_archive_collector.py --discover

      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: internet-archive-candidates
          path: output/internet_archive_candidates.json
          if-no-files-found: error
          retention-days: 7
