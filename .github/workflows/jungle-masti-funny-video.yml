name: Jungle Masti - Funny Cartoon Video (No Tripo Credits)

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: "Type YES to render the Blender cartoon (no Tripo credits used)"
        required: true
        type: string
        default: "NO"

permissions:
  contents: read

concurrency:
  group: jungle-masti-funny-video
  cancel-in-progress: false

jobs:
  generate-and-render:
    if: github.event.inputs.confirm_generation == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Jungle Masti pipeline branch
        uses: actions/checkout@v4
        with:
          ref: jungle-masti-pipeline

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1-mesa-dri libglx-mesa0
          sudo ldconfig
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1' || true
          blender --version
          ffmpeg -version | head -n 1

      - name: Create output directory
        run: mkdir -p /home/runner/JUNGLE_MASTI

      - name: Render premium animated Mango Heist cartoon
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export EGL_PLATFORM=surfaceless
          export MESA_GL_VERSION_OVERRIDE=4.5
          blender --background --python jungle_masti_pipeline/render_funny_mango_heist.py
          test -s /home/runner/JUNGLE_MASTI/Jungle_Masti_Funny_Mango_Heist.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 /home/runner/JUNGLE_MASTI/Jungle_Masti_Funny_Mango_Heist.mp4

      - name: Add original cute cartoon music
        run: |
          cd /home/runner/JUNGLE_MASTI
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 Jungle_Masti_Funny_Mango_Heist.mp4)
          ffmpeg -y -f lavfi -i "sine=frequency=523.25:sample_rate=44100" -f lavfi -i "sine=frequency=659.25:sample_rate=44100" -f lavfi -i "sine=frequency=783.99:sample_rate=44100" -filter_complex "[0:a]volume=0.025[a0];[1:a]volume=0.018[a1];[2:a]volume=0.012[a2];[a0][a1][a2]amix=inputs=3:duration=longest,aloop=loop=-1:size=44100*15,atrim=duration=$DURATION,afade=t=in:st=0:d=0.4,afade=t=out:st=$DURATION:d=0.8[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -shortest Jungle_Masti_With_Cute_Music.mp4
          mv Jungle_Masti_With_Cute_Music.mp4 Jungle_Masti_Funny_Mango_Heist.mp4

      - name: Upload finished cartoon video
        uses: actions/upload-artifact@v4
        with:
          name: jungle-masti-funny-cartoon
          path: /home/runner/JUNGLE_MASTI/Jungle_Masti_Funny_Mango_Heist.mp4
          if-no-files-found: error
          retention-days: 14
