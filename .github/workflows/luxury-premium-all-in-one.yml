name: Luxury Premium All-in-One

on:
  # A workflow-file update runs a safe dry test automatically.
  push:
    paths:
      - ".github/workflows/luxury-premium-all-in-one.yml"
      - ".github/workflows/daily.yml"
      - ".github/workflows/luxury-editor.yml"
      - ".github/workflows/gemini-check.yml"
      - "luxury_pipeline/*.py"
      - "gemini_check.py"
      - "verify_install.py"
  schedule:
    # Three public Luxury Shorts per day (IST): 9:30 AM, 3:30 PM, 7:30 PM.
    - cron: "0 4,10,14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = build only, private = upload privately, public = publish publicly"
        required: true
        type: choice
        options: [dry, private, public]
        default: public
      force:
        description: "Allow another video even if one was already recorded today"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: luxury-premium-all-in-one
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: luxury_pipeline
    env:
      IMAGE_SOURCE: stock
      # Reuse the same OAuth JSON secrets already used by the VYROX uploader.
      YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
      YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
      # Push-triggered verification must never upload, regardless of repository variables.
      UPLOAD_MODE: ${{ github.event_name == 'push' && 'dry' || github.event_name == 'schedule' && 'public' || inputs.mode || 'dry' }}
      VIDEO_RES: ${{ vars.VIDEO_RES || '1080' }}
      TZ_OFFSET_MIN: "330"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ZIP manifest files and Python syntax
        working-directory: .
        run: |
          set -euo pipefail
          python verify_install.py
          python -m py_compile luxury_pipeline/daily_luxury.py luxury_pipeline/luxury_editor.py luxury_pipeline/youtube_device_auth.py gemini_check.py verify_install.py

      - name: Preflight
        run: python daily_luxury.py --preflight

      - name: Build a Short in dry mode or selected upload mode
        run: |
          set -euo pipefail
          ARGS=()
          # Scheduled runs must each create a fresh Short, even after an earlier run today.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python daily_luxury.py --mode "$UPLOAD_MODE" --res "$VIDEO_RES" "${ARGS[@]}"

      - name: Explain where to inspect failure
        if: failure()
        run: |
          echo "Read the preceding Build step for the exact API/FFmpeg error."
          echo "This pipeline uses freely licensed Wikimedia Commons photos. Check the Commons search/download error above."

      - name: Keep generated Short for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-premium-short-${{ github.run_id }}-${{ github.run_attempt }}
          path: luxury_pipeline/output/**/short.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist Luxury topic history
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luxury_pipeline/state/published.json
          if git diff --cached --quiet; then
            echo "No topic history changes to save."
          else
            git commit -m "Save Luxury topic history"
            git pull --rebase
            git push
          fi
