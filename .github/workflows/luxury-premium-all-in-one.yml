name: Luxury Premium All-in-One

on:
  # A workflow-file update runs a safe dry test automatically.
  push:
    paths:
      - ".github/workflows/luxury-premium-all-in-one.yml"
      - ".github/workflows/daily.yml"
      - ".github/workflows/luxury-editor.yml"
      - ".github/workflows/gemini-check.yml"
      - "luxury_pipeline/**"
      - "gemini_check.py"
      - "verify_install.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = build only, private = upload privately, public = publish publicly"
        required: true
        type: choice
        options: [dry, private, public]
        default: dry
      force:
        description: "Allow another video even if one was already recorded today"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luxury-premium-all-in-one
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: luxury_pipeline
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      IMAGE_SOURCE: stock
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # Push-triggered verification must never upload, regardless of repository variables.
      UPLOAD_MODE: ${{ github.event_name == 'push' && 'dry' || inputs.mode || 'dry' }}
      VIDEO_RES: ${{ vars.VIDEO_RES || '1080' }}
      TZ_OFFSET_MIN: "330"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ZIP manifest files and Python syntax
        working-directory: .
        run: |
          set -euo pipefail
          python verify_install.py
          python -m py_compile luxury_pipeline/daily_luxury.py luxury_pipeline/luxury_editor.py luxury_pipeline/youtube_device_auth.py gemini_check.py verify_install.py

      - name: Preflight
        run: python daily_luxury.py --preflight

      - name: Build a Short in dry mode or selected upload mode
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python daily_luxury.py --mode "$UPLOAD_MODE" --res "$VIDEO_RES" "${ARGS[@]}"

      - name: Explain where to inspect failure
        if: failure()
        run: |
          echo "Read the preceding Build step for the exact API/FFmpeg error."
          echo "This pipeline is stock-only. Check PEXELS_API_KEY and Pexels responses in Build logs."

      - name: Keep generated Short for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-premium-short-${{ github.run_id }}-${{ github.run_attempt }}
          path: luxury_pipeline/output/**/short.mp4
          if-no-files-found: ignore
          retention-days: 7

      # Deliberately do not commit luxury_pipeline/state/published.json during this test.
