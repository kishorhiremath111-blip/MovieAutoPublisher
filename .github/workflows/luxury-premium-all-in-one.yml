name: Luxury Premium All-in-One

on:
  # A workflow-file update runs a safe dry test automatically.
  push:
    paths:
      - ".github/workflows/luxury-premium-all-in-one.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = build only, private = upload privately, public = publish publicly"
        required: true
        type: choice
        options: [dry, private, public]
        default: dry
      force:
        description: "Allow another video even if one was already made today"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luxury-premium-all-in-one
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: luxury_pipeline
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      IMAGE_SOURCE: ${{ vars.IMAGE_SOURCE || 'auto' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # Push-triggered verification must never upload, regardless of repo variables.
      UPLOAD_MODE: ${{ github.event_name == 'push' && 'dry' || inputs.mode || 'dry' }}
      VIDEO_RES: ${{ vars.VIDEO_RES || '1080' }}
      GEMINI_IMAGE_SIZE: ${{ vars.GEMINI_IMAGE_SIZE || '2K' }}
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
      TZ_OFFSET_MIN: "330"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ZIP manifest files and Python syntax
        working-directory: .
        run: |
          set -euo pipefail
          python verify_install.py
          python -m py_compile luxury_pipeline/daily_luxury.py luxury_pipeline/luxury_editor.py luxury_pipeline/youtube_device_auth.py gemini_check.py verify_install.py

      - name: Preflight
        run: python daily_luxury.py --preflight

      - name: Build a Short in dry mode or selected upload mode
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python daily_luxury.py --mode "$UPLOAD_MODE" --res "$VIDEO_RES" "${ARGS[@]}"

      - name: Explain failure without exposing secrets
        if: failure()
        continue-on-error: true
        working-directory: .
        run: |
          if [[ -f gemini_check.py ]]; then python gemini_check.py; else echo "gemini_check.py is missing."; fi

      - name: Keep generated Short for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxury-premium-short-${{ github.run_id }}-${{ github.run_attempt }}
          path: luxury_pipeline/output/**/short.mp4
          if-no-files-found: ignore
          retention-days: 7

      # Deliberately do not commit luxury_pipeline/state/published.json during this test.
