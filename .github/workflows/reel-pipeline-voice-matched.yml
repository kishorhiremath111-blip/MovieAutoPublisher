name: Reel Pipeline - Voice Matched

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PUBLIC = upload directly to YouTube; DOWNLOAD = render MP4 only"
        type: choice
        options:
          - public
          - download
        default: public
        required: true

permissions:
  contents: read

concurrency:
  group: reel-pipeline-voice-matched
  cancel-in-progress: false

jobs:
  render-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Manual runs default to public. Any future scheduled trigger also defaults to public.
      DELIVERY_MODE: ${{ github.event_name == 'schedule' && 'public' || inputs.mode || 'public' }}
      ZIP_PATH: reel-pipeline-voice-matched/Reel-Pipeline-Voice-Matched.zip
      EXPECTED_ZIP_SHA256: f2c1026d31b6f7b6c9bd9188794b7103154d8ee6c46f2010fbfc499bd55fd618

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the exact voice-matched ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::Missing $ZIP_PATH. Upload the exact supplied ZIP before running this workflow."
            exit 1
          fi
          actual="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          echo "ZIP SHA-256: $actual"
          if [[ "$actual" != "$EXPECTED_ZIP_SHA256" ]]; then
            echo "::error::ZIP checksum mismatch. The archive must remain byte-for-byte identical."
            exit 1
          fi
          unzip -t "$ZIP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/.reel-pipeline-runtime"
          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/.reel-pipeline-runtime"
          project="$GITHUB_WORKSPACE/.reel-pipeline-runtime/reel_pipeline_voice_matched"
          test -f "$project/make_video.py"
          test -f "$project/voice/voice_reference.wav"
          test -f "$project/scripts/aasman_neela.json"
          echo "Bundled pipeline and voice reference verified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Chatterbox voice-matching dependencies
        working-directory: .reel-pipeline-runtime/reel_pipeline_voice_matched
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-chatterbox.txt

      - name: Preflight - validate reference voice and pipeline
        working-directory: .reel-pipeline-runtime/reel_pipeline_voice_matched
        run: |
          set -euo pipefail
          python -m py_compile make_video.py prepare_voice_reference.py reelkit/*.py
          python make_video.py --help
          python - <<'PY'
          from pathlib import Path
          from scipy.io import wavfile
          import numpy as np
          ref = Path("voice/voice_reference.wav")
          sr, audio = wavfile.read(ref)
          duration = len(audio) / sr
          assert sr == 24000, f"Expected 24000 Hz reference, got {sr}"
          assert audio.ndim == 1, f"Expected mono reference, got {audio.shape}"
          assert 6 <= duration <= 20, f"Unexpected reference duration: {duration:.2f}s"
          assert np.isfinite(audio).all(), "Reference audio has invalid samples"
          print(f"Voice reference OK: {duration:.2f}s / {sr} Hz / mono")
          PY

      - name: Render the full demo with the same reference voice
        working-directory: .reel-pipeline-runtime/reel_pipeline_voice_matched
        shell: bash
        run: |
          set -euo pipefail
          python make_video.py scripts/aasman_neela.json \
            --output "$GITHUB_WORKSPACE/reel-pipeline-voice-matched.mp4" \
            --tts chatterbox \
            --voice-reference voice/voice_reference.wav \
            --language hi \
            --device cpu \
            --hq \
            --fps 30 \
            --workers 2 \
            --music 0.20 2>&1 | tee "$GITHUB_WORKSPACE/reel-pipeline-render.log"

      - name: Validate YouTube Shorts video format
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/reel-pipeline-voice-matched.mp4"
          python - <<'PY'
          import json, subprocess
          path = "reel-pipeline-voice-matched.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", path
          ], text=True)
          data = json.loads(raw)
          streams = data.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          assert video is not None and audio is not None, "Both video and audio streams are required"
          assert video.get("codec_name") == "h264", f"Expected H.264, got {video.get('codec_name')}"
          assert (video.get("width"), video.get("height")) == (1080, 1920), "Expected 1080x1920 vertical video"
          fps = video.get("avg_frame_rate", "0/1")
          n, d = map(int, fps.split("/"))
          assert d and abs(n / d - 30) < 0.2, f"Expected 30 fps, got {fps}"
          duration = float(data.get("format", {}).get("duration", 0))
          assert 3 < duration <= 180, f"Short duration must be 3-180 seconds, got {duration:.2f}s"
          print(f"SHORT FORMAT OK: 1080x1920 | {fps} fps | {duration:.2f}s | H.264 + audio")
          PY

      - name: Install YouTube uploader dependencies
        if: ${{ env.DELIVERY_MODE == 'public' }}
        run: |
          python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload directly as a PUBLIC YouTube Short
        if: ${{ env.DELIVERY_MODE == 'public' }}
        env:
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          set -euo pipefail
          python reel-pipeline-voice-matched/upload_youtube.py \
            "$GITHUB_WORKSPACE/reel-pipeline-voice-matched.mp4" \
            "$GITHUB_WORKSPACE/.reel-pipeline-runtime/reel_pipeline_voice_matched/scripts/aasman_neela.json" \
            "$GITHUB_WORKSPACE/youtube-upload-result.txt"

      - name: Confirm download-only mode
        if: ${{ env.DELIVERY_MODE == 'download' }}
        run: echo "DOWNLOAD ONLY selected. Video rendered successfully; YouTube upload was intentionally skipped."

      - name: Upload MP4 artifact and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-pipeline-voice-matched-${{ github.run_number }}
          path: |
            reel-pipeline-voice-matched.mp4
            reel-pipeline-render.log
            youtube-upload-result.txt
          if-no-files-found: ignore
          retention-days: 14
