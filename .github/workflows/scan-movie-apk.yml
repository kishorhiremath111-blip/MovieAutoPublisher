name: Scan Movie APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scan-movie-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK from this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GH_REF_TYPE:-branch}" == "tag" ]]; then
            TAG="${GH_REF_NAME}"
          else
            TAG="v1.0.0"
          fi
          gh release download "$TAG" --repo "$GH_REPOSITORY" --pattern "Movie.apk" --dir .
          test -s Movie.apk

      - name: Inspect APK archive safely
        run: |
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          apk = Path("Movie.apk")
          video_exts = {".mp4", ".mkv", ".mov", ".webm", ".m4v", ".3gp", ".ts"}
          image_exts = {".png", ".jpg", ".jpeg", ".webp", ".gif"}
          report = {
              "apk": apk.name,
              "size_bytes": apk.stat().st_size,
              "archive_opened": False,
              "video_files": [],
              "image_files_count": 0,
              "media_like_assets": [],
              "video_url_references": [],
              "notes": [
                  "This is a static archive inspection only.",
                  "A URL/reference is not proof that a video can be downloaded or published.",
                  "No DRM, login, or streaming restrictions are bypassed."
              ]
          }
          try:
              with zipfile.ZipFile(apk) as z:
                  report["archive_opened"] = True
                  names = z.namelist()
                  report["video_files"] = [
                      {"path": n, "size_bytes": z.getinfo(n).file_size}
                      for n in names if Path(n).suffix.lower() in video_exts
                  ]
                  report["image_files_count"] = sum(
                      1 for n in names if Path(n).suffix.lower() in image_exts
                  )
                  report["media_like_assets"] = [
                      n for n in names
                      if any(k in n.lower() for k in ("video", "movie", "media", "stream", "player"))
                  ][:300]
                  url_re = re.compile(rb'https?://[^\s"\x00<>]{1,500}', re.I)
                  refs = set()
                  for name in names:
                      if not name.lower().endswith((".xml", ".json", ".html", ".js", ".txt", ".properties", ".smali")):
                          continue
                      try:
                          data = z.read(name)
                      except Exception:
                          continue
                      for match in url_re.findall(data):
                          s = match.decode("utf-8", "ignore").rstrip("),;]}")
                          if re.search(r'\.(mp4|m3u8|mpd|webm|mkv)(\?|$)', s, re.I):
                              refs.add(s[:500])
                  report["video_url_references"] = sorted(refs)[:200]
          except Exception as e:
              report["error"] = str(e)
          Path("apk-scan-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          if not report["archive_opened"]:
              raise SystemExit("Could not open APK as a ZIP archive.")
          PY

      - name: Decompile APK and inspect API/player references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p jadx-out
          # Fetch the official JADX release ZIP; no APK execution or network calls from the app.
          python - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/skylot/jadx/releases/latest",
              headers={"Accept":"application/vnd.github+json","User-Agent":"MovieAutoPublisher-static-analysis"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          assets = [a for a in release.get("assets", []) if a.get("name","").endswith(".zip") and a.get("name","").startswith("jadx-")]
          if not assets:
              raise SystemExit("No official JADX ZIP asset found.")
          asset = next((a for a in assets if a["name"].endswith(".zip")), None)
          print(asset["browser_download_url"])
          open("jadx-download-url.txt","w").write(asset["browser_download_url"])
          PY
          JADJ_URL="$(cat jadx-download-url.txt)"
          curl -fL --retry 3 "$JADJ_URL" -o jadx.zip
          unzip -q jadx.zip -d jadx-dist
          JADX_BIN="$(find jadx-dist -type f -path '*/bin/jadx' | head -n 1)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          "$JADX_BIN" --version
          "$JADX_BIN" --no-res --show-bad-code -d jadx-out Movie.apk > jadx.log 2>&1 || {
            tail -n 100 jadx.log
            exit 1
          }
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path("jadx-out")
          needles = re.compile(r"moviein\\.ajfysu\\.com|/api/vod/info_new|/api/topic/vod_list|/api/search/result|/api/short_play/list|/api/user/down|playable_download_url|m3u8Url|getM3u8Url|getPlayURL|play_url|vod_info|vod_id", re.I)
          results = []
          for p in root.rglob("*.java"):
              try: lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              except Exception: continue
              matched = [i for i,line in enumerate(lines) if needles.search(line)]
              if not matched: continue
              snippets = []
              used = set()
              for i in matched[:80]:
                  lo, hi = max(0,i-5), min(len(lines),i+9)
                  if any(j in used for j in range(lo,hi)): continue
                  used.update(range(lo,hi))
                  snippets.append({"line_start":lo+1,"text":"\\n".join(lines[lo:hi])[:5000]})
              results.append({"file":str(p.relative_to(root)),"matches":len(matched),"snippets":snippets[:30]})
          report = {
            "analysis_type":"static JADX decompilation; app was not executed",
            "source_files_with_api_or_player_matches":len(results),
            "matches":results[:200],
            "notes":[
              "A discovered endpoint or field does not establish that the endpoint is public or that media is licensed for reposting.",
              "No authentication bypass, DRM bypass, or automated stream download is performed.",
              "Use this report to understand API calls and player flow; only publish media you own or have permission to republish."
            ]
          }
          Path("apk-method-analysis.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps({"source_files_with_api_or_player_matches":len(results),"files":[x["file"] for x in results[:80]]},indent=2))
          PY

      - name: Upload decompilation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-apk-method-analysis
          path: |
            apk-method-analysis.json
            jadx.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-apk-scan-report
          path: apk-scan-report.json
          if-no-files-found: warn
          retention-days: 30
