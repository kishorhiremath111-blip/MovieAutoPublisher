name: Temporary Publisher Validation

on:
  push:
    branches: [main]
    paths:
      - 'upload_queue.py'
      - 'cloud_runner.py'
      - 'viral_tracker.py'
      - 'social_clips.py'
      - '.github/workflows/temp-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Verify social generation dispatch
        run: python -m upload_queue --social
