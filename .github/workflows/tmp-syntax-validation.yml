name: Temporary Syntax Validation

on:
  push:
    paths:
      - "MovieAutoPublisher/**"
      - ".github/workflows/tmp-syntax-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile process.py social_clips.py image_posts.py upload_queue.py cloud_runner.py viral_tracker.py pro_editor.py uploaders/youtube.py uploaders/facebook.py scene_tools.py news_engine.py instagram_trends.py trend_engine.py brand_assets.py
      - name: Validate JSON
        run: |
          python -m json.tool config/config.json >/dev/null
          python -m json.tool creative_watchlist.json >/dev/null
          python -m json.tool metadata.json >/dev/null
          python -m json.tool social_sources.json >/dev/null
      - name: Import smoke test
        run: python -c "import pro_editor, process, social_clips, image_posts, upload_queue, cloud_runner, viral_tracker, news_engine, trend_engine, instagram_trends, brand_assets"
