name: Daily Satisfying Video

on:
  schedule:
    - cron: "30 12 * * *"   # roz 6:00 PM IST (UTC 12:30). Time badalna ho to yahan badlo.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test: sirf video banao, upload mat karo"
        type: boolean
        default: true
      force:
        description: "Aaj ka daily limit ignore karo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-satisfying
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Make and upload today's video
        env:
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: python run_pipeline.py

      - name: Save state (used topic remove + counter)
        if: always() && env.DRY_RUN != 'true'
        run: |
          git config user.name "satisfying-bot"
          git config user.email "satisfying-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "State me koi change nahi."
            exit 0
          fi
          git commit -m "state: topic used $(date -u +%F)"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push

      - name: Keep test video / logs (dry run ya failure)
        if: env.DRY_RUN == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: satisfying-test-output
          path: |
            out/*.mp4
            work/*.log
          retention-days: 3
          if-no-files-found: ignore
