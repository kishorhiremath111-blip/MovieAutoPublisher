<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }
  body { position: relative; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000000;
  }
  #hud {
    display: none;
    position: absolute;
    z-index: 2;
    top: 5.8%;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    text-align: center;
    pointer-events: none;
    font-family: Arial, Helvetica, sans-serif;
    color: #f7fdff;
    text-shadow: 0 0 18px rgba(71, 229, 255, .72), 0 2px 12px #000;
  }
  .hud-kicker {
    font-size: clamp(13px, 2.1vw, 34px);
    letter-spacing: .22em;
    font-weight: 700;
    color: #b7f8ff;
  }
  .hud-main {
    margin-top: .22em;
    font-size: clamp(24px, 4.7vw, 76px);
    letter-spacing: .045em;
    font-weight: 900;
  }
  .hud-steps {
    display: flex;
    justify-content: center;
    gap: clamp(8px, 2.1vw, 30px);
    margin-top: .55em;
    font-size: clamp(15px, 2.5vw, 40px);
    font-weight: 800;
  }
  .hud-steps span {
    padding: .12em .42em;
    color: rgba(210, 226, 255, .38);
    border: 1px solid rgba(126, 185, 255, .18);
    border-radius: 999px;
    background: rgba(8, 13, 30, .42);
  }
  .hud-steps span.active {
    color: #fff;
    border-color: rgba(96, 244, 255, .8);
    background: rgba(39, 190, 255, .22);
    box-shadow: 0 0 22px rgba(45, 226, 255, .42);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" aria-hidden="true"></div>
<script>
(function () {
  var urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  function load(i) {
    if (i >= urls.length) {
      window.__error = 'Three.js could not load. Check the runner network access.';
      return;
    }
    var script = document.createElement('script');
    script.src = urls[i];
    script.onload = function () {
      var sceneScript = document.createElement('script');
      sceneScript.src = 'scenes.js';
      sceneScript.onload = function () { window.__ready = true; };
      sceneScript.onerror = function () { window.__error = 'renderer/scenes.js could not load'; };
      document.head.appendChild(sceneScript);
    };
    script.onerror = function () { load(i + 1); };
    document.head.appendChild(script);
  }
  load(0);
})();
</script>
</body>
</html>
