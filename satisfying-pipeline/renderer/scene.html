<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; color: #fff;
    font-family: Arial, Helvetica, sans-serif; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .hud-top { position: absolute; top: 3.4%; left: 5%; right: 5%; display: flex;
    align-items: center; justify-content: space-between; gap: 8px; }
  #topicLabel { max-width: 72%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: clamp(10px, 2.5vw, 17px); font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; }
  #levelLabel { flex: none; padding: 7px 11px; border: 1px solid rgba(255,255,255,.5);
    border-radius: 99px; background: rgba(9,10,28,.42); font-size: clamp(10px, 2.5vw, 14px);
    font-weight: 900; letter-spacing: .1em; }
  #progressTrack { position: absolute; top: 8.7%; left: 5%; right: 5%; height: 4px;
    overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.24); }
  #progressFill { width: 100%; height: 100%; border-radius: inherit; background: #fff;
    transform: scaleX(0); transform-origin: left center; box-shadow: 0 0 12px rgba(255,255,255,.9); }
  #bottomStatus { position: absolute; left: 0; right: 0; bottom: 5.5%; text-align: center;
    font-size: clamp(12px, 3vw, 18px); letter-spacing: .16em; font-weight: 900;
    opacity: .9; transition: opacity .25s; }
  #finishCard { position: absolute; left: 8%; right: 8%; bottom: 15%; text-align: center;
    padding: 18px 12px 16px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(15,12,42,.86), rgba(25,50,85,.78));
    border: 1px solid rgba(255,255,255,.55); box-shadow: 0 12px 40px rgba(0,0,0,.24);
    opacity: 0; transform: translateY(18px) scale(.94); }
  #finishCard.show { animation: finishIn .65s cubic-bezier(.2,.8,.2,1) forwards; }
  #finishTitle { font-size: clamp(23px, 7vw, 42px); line-height: 1.02; font-weight: 1000;
    letter-spacing: .045em; }
  #finishSub { margin-top: 8px; font-size: clamp(11px, 3vw, 16px);
    font-weight: 800; letter-spacing: .2em; opacity: .9; }
  #finishId { margin-top: 7px; font-size: 10px; letter-spacing: .14em; opacity: .62; }
  @keyframes finishIn { to { opacity: 1; transform: translateY(0) scale(1); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hud-top">
    <div id="topicLabel">SATISFYING PATTERN</div>
    <div id="levelLabel">LEVEL 01</div>
  </div>
  <div id="progressTrack"><div id="progressFill"></div></div>
  <div id="bottomStatus">WATCH THE PATTERN COMPLETE</div>
  <div id="finishCard">
    <div id="finishTitle">PERFECT FINISH</div>
    <div id="finishSub">NEXT LEVEL UNLOCKED</div>
    <div id="finishId"></div>
  </div>
</div>
<script>
(function () {
  var urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  function load(i) {
    if (i >= urls.length) { window.__error = 'three.js load nahi hua (internet?)'; return; }
    var script = document.createElement('script');
    script.src = urls[i];
    script.onload = function () {
      var sceneScript = document.createElement('script');
      sceneScript.src = 'scenes.js';
      sceneScript.onload = function () {
        var originalInit = window.initScene;
        var originalRender = window.renderAt;
        window.initScene = function (params) {
          window.__hudParams = params;
          document.getElementById('topicLabel').textContent = params.topic_label || 'SATISFYING PATTERN';
          document.getElementById('levelLabel').textContent = 'LEVEL ' + String(params.level || 1).padStart(2, '0');
          document.getElementById('finishId').textContent = params.topic_id || '';
          return originalInit(params);
        };
        window.renderAt = function (time) {
          var result = originalRender(time);
          var params = window.__hudParams || {};
          var duration = Number(params.duration || 1);
          var progress = Math.max(0, Math.min(1, time / duration));
          document.getElementById('progressFill').style.transform = 'scaleX(' + progress + ')';
          var ending = duration - time <= 3.6;
          document.getElementById('finishCard').classList.toggle('show', ending);
          document.getElementById('bottomStatus').style.opacity = ending ? '0' : '.9';
          if (ending && time >= duration - 0.25) {
            document.getElementById('finishSub').textContent = 'LEVEL ' +
              String((params.level || 1) + 1).padStart(2, '0') + ' READY';
          }
          return result;
        };
        window.__ready = true;
      };
      sceneScript.onerror = function () { window.__error = 'scenes.js load nahi hua'; };
      document.head.appendChild(sceneScript);
    };
    script.onerror = function () { load(i + 1); };
    document.head.appendChild(script);
  }
  load(0);
})();
</script>
</body>
</html>
