<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }
  body { position: relative; }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  function load(i) {
    if (i >= urls.length) {
      window.__error = 'Three.js could not load. Check the runner network access.';
      return;
    }
    var script = document.createElement('script');
    script.src = urls[i];
    script.onload = function () {
      var sceneScript = document.createElement('script');
      sceneScript.src = 'scenes.js';
      sceneScript.onload = function () { window.__ready = true; };
      sceneScript.onerror = function () { window.__error = 'renderer/scenes.js could not load'; };
      document.head.appendChild(sceneScript);
    };
    script.onerror = function () { load(i + 1); };
    document.head.appendChild(script);
  }
  load(0);
})();
</script>
</body>
</html>
